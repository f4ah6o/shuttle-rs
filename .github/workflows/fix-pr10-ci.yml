name: Fix PR 10 CI

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Update MCP response assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/mcp.rs")
          content = path.read_text()

          structured_old = '["result"]["structuredContent"]'
          structured_new = '["result"]["value"]["structuredContent"]'
          structured_count = content.count(structured_old)
          if structured_count == 0:
              raise SystemExit("no structuredContent assertions to update")
          content = content.replace(structured_old, structured_new)

          text_old = 'response["result"]["content"][0]["text"]'
          text_new = 'response["result"]["value"]["content"][0]["text"]'
          if content.count(text_old) != 1:
              raise SystemExit(f"expected one response text helper, found {content.count(text_old)}")
          content = content.replace(text_old, text_new, 1)

          path.write_text(content)
          Path(".github/workflows/fix-pr10-ci.yml").unlink(missing_ok=True)
          Path(".github/fix-pr10-ci-trigger").unlink(missing_ok=True)
      - name: Validate
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: update MCP envelope assertions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
