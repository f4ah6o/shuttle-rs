name: Apply PR 10 review fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: trigger PR review fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: agent/issues-2-3-4-5-6-8-9-public
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              if new in content:
                  return
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              file.write_text(content.replace(old, new, 1))

          replace_once(
              "src/bin/stl.rs",
              '''        println!(
                      "{}",
                      serde_json::to_string_pretty(&shuttle_rs::api::versioned(event)?)?
                  );
          ''',
              '''        println!(
                      "{}",
                      serde_json::to_string(&shuttle_rs::api::versioned(event)?)?
                  );
          ''',
          )

          replace_once(
              "workers/shuttle-gateway/src/api.ts",
              '''  const events = await listEventsService(db, authorized, {
                    eventType: url.searchParams.get("type") ?? undefined,
                    sessionId: url.searchParams.get("session_id") ?? undefined,
                    agent: url.searchParams.get("agent") ?? undefined,
                    targetAgent: url.searchParams.get("target_agent") ?? undefined,
                    after,
                    limit,
                    before: parseBeforeCursor(url.searchParams.get("before")),
                  });
                  const last = events[events.length - 1];
                  return json({
                    events,
                    has_more: events.length === limit,
          ''',
              '''  const page = await listEventsService(db, authorized, {
                    eventType: url.searchParams.get("type") ?? undefined,
                    sessionId: url.searchParams.get("session_id") ?? undefined,
                    agent: url.searchParams.get("agent") ?? undefined,
                    targetAgent: url.searchParams.get("target_agent") ?? undefined,
                    after,
                    limit: limit + 1,
                    before: parseBeforeCursor(url.searchParams.get("before")),
                  });
                  const hasMore = page.length > limit;
                  const events = page.slice(0, limit);
                  const last = events[events.length - 1];
                  return json({
                    events,
                    has_more: hasMore,
          ''',
          )

          Path(".github/workflows/apply-pr10-review-fixes.yml").unlink(missing_ok=True)
      - name: Format and test
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo test --workspace --all-targets
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: address PR review feedback"
          git push origin HEAD:agent/issues-2-3-4-5-6-8-9-public
