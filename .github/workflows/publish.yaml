name: Publish

on:
  push:
    tags:
      - latest

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: f4ah6o/calver-action/.github/workflows/rust-crate.yaml@ed77f35391c8a334e420974bb7983b0a13fc5deb
    with:
      format: YYYY.MM.PATCH
      timezone: Asia/Tokyo
      legacy_prefixes: v

  create-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes "Shuttle release artifacts for ${RELEASE_TAG} (source ${SOURCE_SHA})." || \
              gh release view "${RELEASE_TAG}" >/dev/null
          fi

  gateway-lxc-archives:
    needs:
      - release
      - create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: gateway-lxc-${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build gateway binaries
        run: cross build --release --target "${{ matrix.target }}" --bin shuttle-gateway --bin stl

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          archive="shuttle-gateway-lxc-${{ matrix.target }}"
          root="dist/${archive}/shuttle-gateway-lxc"

          install -d "${root}/bin" "${root}/etc" "${root}/systemd"
          install -m 0755 "target/${{ matrix.target }}/release/shuttle-gateway" "${root}/bin/shuttle-gateway"
          install -m 0755 "target/${{ matrix.target }}/release/stl" "${root}/bin/stl"
          install -m 0644 packaging/lxc/projects.toml.example "${root}/etc/projects.toml.example"
          install -m 0644 packaging/lxc/shuttle-gateway.env.example "${root}/etc/shuttle-gateway.env.example"
          install -m 0644 packaging/lxc/shuttle-gateway.service "${root}/systemd/shuttle-gateway.service"
          install -m 0755 packaging/lxc/install.sh "${root}/install.sh"

          tar -C "dist/${archive}" -czf "dist/${archive}.tar.gz" shuttle-gateway-lxc

      - name: Upload LXC archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" "dist/shuttle-gateway-lxc-${{ matrix.target }}.tar.gz" --clobber
