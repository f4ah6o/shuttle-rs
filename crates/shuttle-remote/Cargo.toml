shuttle-store = { path = "../shuttle-store" }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
futures-executor.workspace = true
shuttle-memory = { path = "../shuttle-memory" }
tempfile.workspace = true
